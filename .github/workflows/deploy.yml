name: CI & Despliegue Sistema Winners

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Verificación de Código y Monitoreo de Producción
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar Sintaxis de Worker Cloudflare
        run: |
          node --check worker.js
          echo "Worker.js validado con éxito."

      - name: Validar Integridad de Archivos Críticos
        run: |
          files=(
            "index.html"
            "consulta-devoluciones.html"
            "zona-clientes.html"
            "tu-pago-en-linea.html"
            "devoluciones.html"
            "resultados-asamblea.html"
            "gerente.html"
            "worker.js"
            "wrangler.jsonc"
            "_redirects"
            "_headers"
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Falta el archivo crítico $file"
              exit 1
            fi
            echo "OK: $file presente."
          done

      - name: Despliegue con Wrangler (si existe token configurado)
        if: "${{ env.CLOUDFLARE_API_TOKEN != '' }}"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Monitorear Disponibilidad de Producción (Health Check)
        run: |
          echo "Comprobando disponibilidad en vivo de https://sistemawinners.com..."
          sleep 5
          curl -sS -I https://sistemawinners.com/ | grep -E "HTTP/.* 200" || exit 1
          curl -sS -I https://sistemawinners.com/api/health | grep -E "HTTP/.* 200" || exit 1
          curl -sS -I -L https://sistemawinners.com/consulta-devoluciones | grep -E "HTTP/.* 200" || exit 1
          curl -sS -I -L https://sistemawinners.com/gerente | grep -E "HTTP/.* 200" || exit 1
          echo "Todos los servicios de Sistema Winners están activos y respondiendo 200 OK."
